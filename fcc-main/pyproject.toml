[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "free-claude-code"
version = "5.14.2"
description = "Local proxy connecting coding agents to OpenAI-compatible AI providers"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core Web Framework
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.1",

    # Networking / HTTP Clients
    "httpx[socks]>=0.28.1",
    "httpx2[socks]>=2.7.0,<3",
    "aiohttp>=3.14.3",
    "requests[socks]>=2.34.2",
    "google-auth[requests]>=2.56.3",

    # Typing / Validation / Schema
    "pydantic>=2.13.4",
    "markdown-it-py>=4.2.0",
    "jsonschema>=4.25.0",

    # Environment / Config
    "python-dotenv>=1.2.2",

    # AI / ML Stack (Modern, Conflict-Free)
    "tiktoken>=0.13.0",
    "sentence-transformers>=2.2.0",
    "accelerate>=1.0.0",

    # Modern LangChain (Classic removed)
    "langchain>=0.2.11",
    "langchain-core>=0.2.23,<0.3.0",

    # Modern ChromaDB (Pydantic v2 compatible)
    "chromadb>=0.5.3",

    # OpenAI Client
    "openai>=3.2.0",

    # Messaging / Bots
    "python-telegram-bot>=22.8",
    "discord.py>=2.7.1",
    "typer>=0.9.0",

    # Logging / Retry (Fixed)
    "loguru>=0.7.0",
    "python-json-logger>=2.0.7",
    "tenacity==8.2.3",
    "backoff>=2.2.1",

    # Auth / Crypto
    "cryptography>=42.0.0",
    "authlib>=1.3.0",

    # Platform Extras
    "pystray>=0.19.5; sys_platform == 'win32' or sys_platform == 'darwin'",
    "Pillow>=12.0.0; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.scripts]
fcc-server = "free_claude_code.cli.entrypoints:serve"
fcc-claude = "free_claude_code.cli.launchers.claude:launch"
fcc-codex = "free_claude_code.cli.launchers.codex:launch"
fcc-pi = "free_claude_code.cli.launchers.pi:launch"
fcc-opencode = "free_claude_code.cli.launchers.opencode:launch"
fcc-cline = "free_claude_code.cli.launchers.cline:launch"
fcc-hermes = "free_claude_code.cli.launchers.hermes:launch"
fcc-muse = "free_claude_code.cli.launchers.muse:launch"
fcc-setup = "free_claude_code.cli.entrypoints:setup_wizard"
fcc-admin = "free_claude_code.cli.entrypoints:open_admin_ui"
fcc-agents = "free_claude_code.cli.launchers.agents:list_agents"
fcc-tools = "free_claude_code.cli.tools:list_tools"
fcc-models = "free_claude_code.cli.models:list_models"
fcc-status = "free_claude_code.cli.entrypoints:server_status"
fcc-log = "free_claude_code.cli.entrypoints:tail_logs"
fcc-config = "free_claude_code.cli.entrypoints:config_info"
fcc-provider = "free_claude_code.cli.providers:provider_cli"
fcc-monitor = "free_claude_code.cli.monitoring:launch_monitoring"

[project.gui-scripts]
fcc-desktop = "free_claude_code.cli.desktop_entrypoint:launch"

[tool.hatch.build.targets.wheel]
packages = ["src/free_claude_code"]

[tool.uv]
required-version = ">=0.11.16"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ty>=0.0.70",
    "ruff>=0.16.2",
    "pytest-xdist>=3.8.0",
    "pytest-playwright>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
ignore = ["E501", "B008", "RUF006"]

[tool.ruff.lint.isort]
known-first-party = ["free_claude_code", "smoke"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-n auto"
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
    "live",
    "interactive",
    "provider",
    "messaging",
    "cli",
    "clients",
    "voice",
    "contract",
    "smoke_target(name)",
    "xdist_group(name)",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "torch",
    "transformers",
    "librosa",
    "riva.client",
    "pystray",
    "PIL",
]
